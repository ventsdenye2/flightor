name: flightor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flightor
      POSTGRES_USER: flightor
      POSTGRES_PASSWORD: flightor_dev
    ports:
      - "5432:5432"
    volumes:
      - flightor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightor -d flightor"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - flightor_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: build
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://flightor:flightor_dev@postgres:5432/flightor
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://flightor:flightor_dev@postgres:5432/flightor
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://flightor:flightor_dev@postgres:5432/flightor
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flightor_postgres:
  flightor_redis:
